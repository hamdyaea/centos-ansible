- name: Generate AIDE candidate database for manual review
  hosts: managed
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Generate candidate AIDE database without promoting it
      ansible.builtin.command: /usr/sbin/aide --update
      register: aide_update
      changed_when: true
      failed_when: aide_update.rc not in [0, 1, 2, 3, 4, 5, 6, 7]
    - name: Remind administrator to verify integrity differences
      ansible.builtin.debug:
        msg: >-
          AIDE generated a candidate database. Investigate every change and
          review the new database before manually replacing the trusted baseline.
          This playbook never copies the candidate over the baseline.
