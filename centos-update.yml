- name: Update Enterprise Linux 8+ hosts
  hosts: managed
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Update installed packages with DNF
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      when: ansible_facts.os_family == "RedHat"
