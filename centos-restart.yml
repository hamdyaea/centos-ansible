- name: Explicit controlled restart of Enterprise Linux hosts
  hosts: managed
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Reboot and wait for the managed host to return
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 60
